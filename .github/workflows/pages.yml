name: 部署靜態網站
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 檢查頁面及資料
        run: npm run check
      - uses: actions/configure-pages@v5
      - name: 整理網站檔案
        run: |
          mkdir _site
          cp *.html _site/
          cp -r assets data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 發佈網站
        id: deployment
        uses: actions/deploy-pages@v4
